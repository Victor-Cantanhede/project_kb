upstream api_backend {
    server api1:3000;
    server api2:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15M;

    root /usr/share/nginx/html;
    index index.html;

    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"O arquivo ou payload enviado excede o tamanho máximo permitido.","fields":[{"field":"file","message":"Arquivo ou payload muito grande."}]}}';
    }

    location ~ ^/(api|heroes|missions|imports|avatars|health)(/|$) {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

